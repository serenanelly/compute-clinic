services:
  tenant-db:
    image: postgres:15-alpine
    container_name: fultang-tenant-db
    restart: always
    environment:
      POSTGRES_USER: tenant_user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: tenant_registry_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - fultang_shared_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tenant_user -d tenant_registry_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  web:
    build: .
    container_name: fultang-tenant-web
    command: >
      sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    volumes:
      - .:/app
    ports:
      - "8005:8000"
    environment:
      - DB_HOST=tenant-db
      # Jeton service-to-service Gateway → Tenant Service (Phase 2.1).
      # Dev uniquement : à surcharger via un .env / secret en production.
      # Doit être identique à la valeur utilisée par api-gateway.
      - TENANT_SERVICE_INTERNAL_TOKEN=${TENANT_SERVICE_INTERNAL_TOKEN:-dev-local-only-shared-secret-change-me}
    depends_on:
      tenant-db:
        condition: service_healthy
    networks:
      - fultang_shared_network

  # Un service temporaire dédié exclusivement aux tests
  test_runner:
    build: .
    command: >
      sh -c "python manage.py test tenants"
    volumes:
      - .:/app
    environment:
      - DB_HOST=tenant-db
    depends_on:
      - tenant-db
    networks:
      - fultang_shared_network

volumes:
  postgres_data:

networks:
  fultang_shared_network:
    name: fultang_shared_network
    external: true
