services:
  infrastructure-db:
    image: postgres:15-alpine
    container_name: fultang-infrastructure-db
    restart: always
    environment:
      POSTGRES_USER: infrastructure_user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: infrastructure_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - fultang_shared_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U infrastructure_user -d infrastructure_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  web:
    build: .
    container_name: fultang-infrastructure-web
    command: >
      sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    volumes:
      - .:/app
    ports:
      - "8002:8000"
    environment:
      - DB_HOST=infrastructure-db
      - TENANT_SERVICE_URL=http://fultang-tenant-web:8000
      - TENANT_SERVICE_INTERNAL_TOKEN=${TENANT_SERVICE_INTERNAL_TOKEN:-dev-local-only-shared-secret-change-me}
      - TENANT_DB_USER=infrastructure_user
      - TENANT_DB_PASSWORD=password
    depends_on:
      infrastructure-db:
        condition: service_healthy
    networks:
      - fultang_shared_network

  # Un service temporaire dédié exclusivement aux tests
  test_runner:
    build: .
    command: >
      sh -c "python manage.py test infrastructures"
    volumes:
      - .:/app
    environment:
      - DB_HOST=infrastructure-db
    depends_on:
      - infrastructure-db
    networks:
      - fultang_shared_network

volumes:
  postgres_data:

networks:
  fultang_shared_network:
    name: fultang_shared_network
    external: true
