services:
  api-gateway:
    build: ./api-gateway
    container_name: fultang-gateway
    ports:
      - "8080:8080"
    environment:
      - SERVICE_PERSONNEL_URL=http://fultang-personnel:8000
      - SERVICE_MEDICAL_URL=http://fultang-medical-backend:8000
      - SERVICE_INFRASTRUCTURE_URL=http://fultang-infrastructure-web:8000
      - SERVICE_COMPTA_FINANCIERE_URL=http://fultang-compta-financiere-backend:8000
      - SERVICE_COMPTA_MATIERE_URL=http://fultang-compta-matiere-backend:8000
      # Jeton service-to-service Gateway → Tenant Service (Phase 2.1).
      # Dev uniquement : à surcharger via un .env / secret en production.
      # Doit être identique à la valeur utilisée par tenant-service.
      - TENANT_SERVICE_INTERNAL_TOKEN=${TENANT_SERVICE_INTERNAL_TOKEN:-dev-local-only-shared-secret-change-me}
      # Cycle de vie du tenant (Phase 2) : convention de développement
      # local pour l'URL réelle d'un établissement — un sous-domaine
      # `*.localhost` se résout automatiquement vers 127.0.0.1 dans les
      # navigateurs modernes, aucune entrée /etc/hosts à créer (à la
      # différence de `*.fulltang.com`, qui reste utilisable en
      # surchargeant cette variable pour un environnement de démo plus
      # proche de la production).
      - TENANT_ROOT_DOMAIN=${TENANT_ROOT_DOMAIN:-localhost}
    depends_on:
      - service-personnel
    networks:
      - fultang_shared_network

  service-personnel:
    build: ./service-personnel
    container_name: fultang-personnel
    environment:
      - POSTGRES_DB=service_personnel
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=password
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      # Phase 6 (Dynamic Database Routing) : communication interne vers
      # le Tenant Registry, même jeton partagé que la Gateway (dev
      # uniquement — à surcharger via un .env / secret en production).
      - TENANT_SERVICE_URL=http://fultang-tenant-web:8000
      - TENANT_SERVICE_INTERNAL_TOKEN=${TENANT_SERVICE_INTERNAL_TOKEN:-dev-local-only-shared-secret-change-me}
      # Credentials PostgreSQL partagés pour TOUTES les bases tenant de ce
      # service dans cette phase (pas de Secret Manager — voir Phase 5 §6
      # et MULTITENANT_ARCHITECTURE.md §9.2.9). Par défaut, identiques à
      # POSTGRES_USER/PASSWORD ci-dessus.
      - TENANT_DB_USER=admin
      - TENANT_DB_PASSWORD=password
    # Bind-mount du code source (comme les autres microservices) : les modifs
    # sont prises en compte par runserver sans rebuild d'image.
    volumes:
      - ./service-personnel:/app
    depends_on:
      postgres:
        condition: service_healthy
    restart: on-failure
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/api/', timeout=3)\" 2>/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - fultang_shared_network

  postgres:
    image: postgres:15-alpine
    container_name: fultang-postgres
    environment:
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=service_personnel
    ports:
      - "5435:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d service_personnel"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - fultang_shared_network

  tampon-db:
    image: postgres:15-alpine
    container_name: fultang-tampon-db
    environment:
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=tampon_clinical_cases
    ports:
      - "5436:5432"
    volumes:
      - tampon_postgres_data:/var/lib/postgresql/data
    networks:
      - fultang_shared_network

  clinical-agent:
    build: ./clinical-agent
    container_name: fultang-clinical-agent
    ports:
      - "9000:9000"
    volumes:
      - ./certs:/app/certs:ro
    # Dev local uniquement : le Dockerfile expose un CMD avec TLS
    # (--ssl-keyfile/--ssl-certfile) pour la prod, mais AUCUN autre appel
    # interne de FullTang en dev ne parle HTTPS (Gateway↔services,
    # signal Medical-Monitoring→clinical-agent inclus — voir
    # medical_workflow/signals.py::CLINICAL_AGENT_URL, resté en
    # `http://`). Avant ce chantier, ce décalage était invisible : le
    # conteneur ne démarrait jamais (certs/ vide) et l'appel HTTP au
    # signal échouait donc silencieusement (connexion refusée) de la
    # même façon qu'un vrai mismatch TLS. Pas une régression introduite
    # ici — un défaut de config latent, démasqué en le faisant enfin
    # démarrer. Correction dev : down-scope au HTTP simple, cohérent
    # avec le reste de la stack locale ; le Dockerfile/CMD (image prod)
    # n'est pas modifié.
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "9000", "--log-level", "info"]
    environment:
      # MAIN_DB_URL retiré : Medical-Monitoring est désormais en Database
      # per Tenant — il n'existe plus "une" base principale unique (voir
      # registry_client.py/engine_registry.py, qui résolvent une base par
      # tenant via le Tenant Registry).
      - TAMPON_DB_URL=postgresql://admin:password@fultang-tampon-db:5432/tampon_clinical_cases
      - MEDTUTOR_API_KEY_HASH=${MEDTUTOR_API_KEY_HASH}
      # :-defaut nécessaire : une variable présente mais vide (${VAR} sans
      # valeur ni :-) écrase le fallback int(os.getenv(..., "10")) de
      # main.py, puisque la variable EXISTE alors (vide), elle n'est pas
      # absente — int('') lève, empêchant le service de démarrer.
      - FULTANG_RATE_LIMIT_REQUESTS=${FULTANG_RATE_LIMIT_REQUESTS:-10}
      - FULTANG_RATE_LIMIT_WINDOW_SECONDS=${FULTANG_RATE_LIMIT_WINDOW_SECONDS:-60}
      # Tenant routing (chantier Medical-Monitoring tenant-aware) : mêmes
      # noms de variables et même jeton partagé que le reste de FullTang.
      - TENANT_SERVICE_URL=http://fultang-tenant-web:8000
      - TENANT_SERVICE_INTERNAL_TOKEN=${TENANT_SERVICE_INTERNAL_TOKEN:-dev-local-only-shared-secret-change-me}
      - TENANT_DB_USER=fultang_user
      - TENANT_DB_PASSWORD=fultang_password_here
    depends_on:
      - tampon-db
    networks:
      - fultang_shared_network
    restart: unless-stopped

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: fultang-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - fultang_shared_network

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: fultang-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: fultang-zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://fultang-kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
    networks:
      - fultang_shared_network

volumes:
  postgres_data:
  tampon_postgres_data:

networks:
  fultang_shared_network:
    name: fultang_shared_network
    external: true
